name: Validate

on:
  push:
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run unit tests
        run: |
          output="$(godot --headless --path . --script res://tests/run.gd 2>&1)"
          echo "$output"
          grep -q "All headless project tests passed" <<< "$output"
      - name: Verify editor preview isolation
        run: |
          output="$(godot --headless --path . --script res://tests/editor_preview.gd 2>&1)"
          echo "$output"
          grep -q "Editor preview isolation passed" <<< "$output"
      - name: Validate content (errors block CI)
        run: godot --headless --path . --script res://scripts/validate_content.gd
      - name: Smoke test game scenes
        run: |
          godot --headless --path . res://scenes/main.tscn --quit-after 2
          godot --headless --path . res://scenes/battle.tscn --quit-after 2
          godot --headless --path . res://scenes/village.tscn --quit-after 2
          godot --headless --path . res://scenes/village_research.tscn --quit-after 2
          godot --headless --path . res://scenes/editor_preview.tscn --quit-after 2
